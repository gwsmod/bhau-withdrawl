<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>BHau Lotto - User Info</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #141a2b;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            color: #eef2f9;
            border: 1px solid #2a3450;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #7dffb3, #3d5aa0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            color: #8895bb;
            font-size: 13px;
            margin-top: 4px;
            border-left: 3px solid #3b4b75;
            padding-left: 12px;
            display: inline-block;
        }
        .card {
            background: #10182b;
            border-radius: 24px;
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid #25304a;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a5b3d6;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: #0f1629;
            border: 1px solid #293753;
            border-radius: 40px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #5a76b0;
            box-shadow: 0 0 0 3px #1e2c4a;
        }
        .btn {
            padding: 13px 16px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            background: #3d5aa0;
            color: #fff;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
            text-align: center;
            box-shadow: 0 5px 0 #0f1629;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f1629;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 0 5px 0 #0f1629 !important;
        }
        .btn-logout {
            background: #b13e4b;
            box-shadow: 0 5px 0 #1a0a0a;
            margin-top: 10px;
        }
        .btn-refresh {
            background: #2a4a6a;
            box-shadow: 0 5px 0 #0a1a2a;
            margin-top: 8px;
        }
        .hidden {
            display: none !important;
        }
        .toast {
            background: #1b2542;
            border-radius: 40px;
            padding: 11px 16px;
            margin-top: 10px;
            border-left: 4px solid #5a76b0;
            font-size: 14px;
        }
        .toast.error {
            border-left-color: #c04a5a;
            background: #231b2b;
        }
        .toast.success {
            border-left-color: #3aad6a;
        }
        .info-grid {
            display: grid;
            gap: 10px;
        }
        .info-item {
            background: #0c1427;
            padding: 12px 16px;
            border-radius: 16px;
            border-left: 3px solid #3d5aa0;
        }
        .info-item .label {
            font-size: 11px;
            color: #8895bb;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-item .label .refresh-small {
            background: #1a2a3a;
            border: none;
            color: #5a8aba;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            cursor: pointer;
        }
        .info-item .label .refresh-small:hover {
            background: #2a4a5a;
        }
        .info-item .value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            color: #eef2f9;
            word-break: break-all;
        }
        .info-item .value.balance {
            color: #7dffb3;
            font-size: 28px;
            font-weight: 700;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.online {
            background: #1a3a2a;
            color: #7dffb3;
        }
        .status-badge.offline {
            background: #3a1a1a;
            color: #ff6b6b;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #4a5a7a;
            margin-top: 16px;
        }
        .bank-card {
            background: #0c1427;
            padding: 12px 16px;
            border-radius: 16px;
            border-left: 3px solid #ffd700;
            margin-top: 6px;
        }
        .bank-card .bank-name {
            font-weight: 600;
            color: #ffd700;
        }
        .bank-card .details {
            font-size: 14px;
            color: #c6d2f0;
            margin-top: 4px;
        }
        .bank-card .ifsc {
            font-size: 12px;
            color: #8895bb;
            margin-top: 2px;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2a3a5a;
            border-top: 3px solid #7dffb3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .debug-box {
            background: #0a0f1a;
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 10px;
            margin-top: 10px;
            font-size: 11px;
            color: #4a6a8a;
            max-height: 150px;
            overflow: auto;
            font-family: monospace;
        }
        .debug-box .success {
            color: #7dffb3;
        }
        .debug-box .error {
            color: #ff6b6b;
        }
        .debug-box .info {
            color: #5a8aba;
        }
        .phone-display {
            font-size: 18px;
            font-weight: 600;
            color: #eef2f9;
        }
        .balance-currency {
            font-size: 16px;
            color: #8895bb;
            margin-right: 2px;
        }
        .last-updated {
            font-size: 10px;
            color: #4a5a7a;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <h1>🎯 BHAU LOTTO</h1>
            <div class="sub">🔑 Default pass: Sanju2005</div>
        </div>

        <!-- Login Section -->
        <div id="loginSection">
            <div class="card">
                <div class="input-group">
                    <label>📱 Phone (10 digits)</label>
                    <input type="tel" id="phoneInput" placeholder="9876543210" maxlength="10" inputmode="numeric" />
                </div>
                <button class="btn" id="loginBtn">🔑 Login</button>
                <div id="loginStatus" class="toast hidden"></div>
                <div id="debugBox" class="debug-box hidden"></div>
            </div>
        </div>

        <!-- User Info Section -->
        <div id="userInfoSection" class="hidden">
            <div class="card" style="border-color: #3aad6a;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <span class="status-badge online">● Online</span>
                    <span class="phone-display" id="userPhoneDisplay">📱 +91</span>
                </div>
                
                <div class="info-grid">
                    <div class="info-item" style="border-left-color: #7dffb3;">
                        <div class="label">
                            <span>💰 Balance</span>
                            <button class="refresh-small" id="refreshBalanceBtn">⟳ Refresh</button>
                        </div>
                        <div class="value balance" id="balanceDisplay">—</div>
                        <div class="last-updated" id="lastUpdated">Last updated: —</div>
                    </div>
                    <div class="info-item">
                        <div class="label">🆔 User ID</div>
                        <div class="value" id="userIdDisplay">—</div>
                    </div>
                    <div class="info-item">
                        <div class="label">🏦 Bank Cards</div>
                        <div id="cardsDisplay" style="margin-top:6px;">
                            <span style="color:#8895bb;font-size:13px;">No cards added</span>
                        </div>
                    </div>
                </div>

                <button class="btn btn-refresh" id="refreshAllBtn">🔄 Refresh All Data</button>
                <button class="btn btn-logout" id="logoutBtn">🚪 Logout</button>
            </div>
        </div>

        <div class="footer">BHau Lotto • User Info Tool</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── State ──────────────────────────────────────────
            const state = {
                token: null,
                phone: null,
                userData: null,
                balance: null,
                cards: [],
                isLoggedIn: false,
                lastUpdate: null
            };

            // ─── DOM Refs ──────────────────────────────────────
            const $ = id => document.getElementById(id);
            const loginSection = $('loginSection');
            const userInfoSection = $('userInfoSection');
            const phoneInput = $('phoneInput');
            const loginBtn = $('loginBtn');
            const loginStatus = $('loginStatus');
            const logoutBtn = $('logoutBtn');
            const refreshBalanceBtn = $('refreshBalanceBtn');
            const refreshAllBtn = $('refreshAllBtn');
            const userPhoneDisplay = $('userPhoneDisplay');
            const balanceDisplay = $('balanceDisplay');
            const userIdDisplay = $('userIdDisplay');
            const cardsDisplay = $('cardsDisplay');
            const debugBox = $('debugBox');
            const lastUpdated = $('lastUpdated');

            // ─── Config ─────────────────────────────────────────
            function getConfig() {
                return {
                    base: 'https://api.bh2255.xyz',
                    pay: 'https://api.bh556677ww.com',
                    card: 'https://api.bh2266.xyz',
                    packageId: 2,
                    packageInfo: 'com.resulta.checka',
                    channelId: 'Samsung',
                    origin: 'https://playbhau.com',
                    referer: 'https://playbhau.com/'
                };
            }

            function getDeviceId() {
                let id = localStorage.getItem('bhau_device_id');
                if (!id) {
                    id = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
                    localStorage.setItem('bhau_device_id', id);
                }
                return id;
            }

            function getVisitor() {
                return 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
            }

            function getReqDate() { return Date.now(); }

            // ─── Toast ──────────────────────────────────────────
            function showToast(el, msg, type) {
                el.classList.remove('hidden', 'error', 'success');
                el.textContent = msg;
                if (type) el.classList.add(type);
                clearTimeout(el._toastTimer);
                el._toastTimer = setTimeout(() => el.classList.add('hidden'), 5000);
            }

            // ─── Debug ─────────────────────────────────────────
            function showDebug(msg, type) {
                debugBox.classList.remove('hidden');
                const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
                debugBox.innerHTML += `<div class="${className}">${new Date().toLocaleTimeString()}: ${msg}</div>`;
                debugBox.scrollTop = debugBox.scrollHeight;
            }

            function clearDebug() {
                debugBox.innerHTML = '';
                debugBox.classList.add('hidden');
            }

            // ─── API Calls ─────────────────────────────────────
            async function apiLogin(phone, password) {
                password = password || 'Sanju2005';
                const cfg = getConfig();
                const deviceId = getDeviceId();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    userPhone: phone,
                    password: password,
                    deviceCode: deviceId,
                    distinctId: deviceId,
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    platform: 'h5',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    versionCode: '999',
                    deviceBrand: 'Android',
                    deviceModel: 'Unknown',
                    visitor: visitor,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };
                
                showDebug('📡 Sending login request...', 'info');
                showDebug(`📱 Phone: ${phone}`, 'info');
                
                try {
                    const resp = await fetch(cfg.base + '/app/password/login', {
                        method: 'POST',
                        headers: {
                            'accept': 'application/json, text/plain, */*',
                            'content-type': 'application/json',
                            'origin': cfg.origin,
                            'referer': cfg.referer,
                            'x-device-id': deviceId,
                            'user-agent': 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await resp.json();
                    showDebug(`📊 Status: ${resp.status}`, 'info');
                    
                    console.log('Login Response:', data);
                    
                    if (resp.status === 200 && (data.code === 0 || data.success === true)) {
                        
                        let token = null;
                        let userData = null;
                        
                        if (typeof data.data === 'string' && data.data.startsWith('eyJ')) {
                            token = data.data;
                            showDebug('✅ Token found in data.data (JWT)', 'success');
                        } 
                        else if (typeof data.data === 'object' && data.data !== null) {
                            userData = data.data;
                            if (data.data.accessToken) token = data.data.accessToken;
                            else if (data.data.token) token = data.data.token;
                        }
                        else if (data.accessToken) token = data.accessToken;
                        else if (data.token) token = data.token;
                        
                        if (token) {
                            state.token = token;
                            state.phone = phone;
                            state.isLoggedIn = true;
                            
                            if (userData) {
                                state.userData = userData;
                            } else if (typeof data.data === 'string') {
                                try {
                                    const parts = token.split('.');
                                    if (parts.length === 3) {
                                        const payload = JSON.parse(atob(parts[1]));
                                        console.log('JWT Payload:', payload);
                                        state.userData = payload;
                                    }
                                } catch (e) {
                                    console.log('Could not parse JWT');
                                }
                            }
                            
                            localStorage.setItem('bhau_token', token);
                            localStorage.setItem('bhau_phone', phone);
                            localStorage.setItem('bhau_logged_in', 'true');
                            
                            showDebug('✅ Login successful!', 'success');
                            return { success: true, token: token };
                        } else {
                            showDebug('❌ Token not found', 'error');
                            return { success: false, msg: 'Token not found' };
                        }
                    } else {
                        const errorMsg = data.msg || data.message || 'Login failed';
                        showDebug(`❌ ${errorMsg}`, 'error');
                        return { success: false, msg: errorMsg };
                    }
                } catch (e) {
                    console.error('Login error:', e);
                    showDebug(`❌ Error: ${e.message}`, 'error');
                    return { success: false, msg: e.message || 'Network error' };
                }
            }

            async function apiGetBalance() {
                if (!state.token) return null;
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    versionCode: '999',
                    visitor: visitor,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };
                const endpoints = [
                    cfg.base + '/app/user/getBalanceV2?gameType=POST',
                    cfg.base + '/app/user/info',
                    cfg.base + '/app/user/getBalance'
                ];
                for (const url of endpoints) {
                    try {
                        const resp = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'accept': 'application/json',
                                'content-type': 'application/json',
                                'token': state.token,
                                'origin': cfg.origin,
                                'referer': cfg.referer
                            },
                            body: JSON.stringify(payload)
                        });
                        if (resp.status === 200) {
                            const data = await resp.json();
                            console.log('Balance Response:', data);
                            if (data.code === 0) {
                                const ud = data.data || {};
                                let balance = null;
                                if (ud.balance !== undefined && ud.balance !== null) balance = ud.balance;
                                else if (ud.coin !== undefined && ud.coin !== null) balance = ud.coin;
                                else if (ud.coins !== undefined && ud.coins !== null) balance = ud.coins;
                                else if (ud.amount !== undefined && ud.amount !== null) balance = ud.amount;
                                else if (ud.credit !== undefined && ud.credit !== null) balance = ud.credit;
                                else if (ud.totalBalance !== undefined && ud.totalBalance !== null) balance = ud.totalBalance;
                                
                                if (balance !== null) {
                                    return parseFloat(balance);
                                }
                            }
                        }
                    } catch (_) { /* ignore */ }
                }
                return null;
            }

            async function apiGetCards() {
                if (!state.token) return [];
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    versionCode: '999',
                    visitor: visitor
                };
                const endpoints = [
                    'https://api.bh556677wplus.com/app/card/info',
                    cfg.card + '/app/card/list',
                    cfg.pay + '/app/card/info'
                ];
                for (const url of endpoints) {
                    try {
                        const resp = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'accept': 'application/json',
                                'content-type': 'application/json',
                                'token': state.token,
                                'packageid': String(cfg.packageId),
                                'origin': cfg.origin,
                                'referer': cfg.referer
                            },
                            body: JSON.stringify(payload)
                        });
                        if (resp.status === 200) {
                            const data = await resp.json();
                            console.log('Cards Response:', data);
                            if (data.code === 0) {
                                let cards = data.data;
                                if (Array.isArray(cards) && cards.length > 0) {
                                    state.cards = cards;
                                    return cards;
                                } else if (typeof cards === 'object' && cards !== null) {
                                    for (const key of ['list', 'cards', 'cardList']) {
                                        if (Array.isArray(cards[key]) && cards[key].length > 0) {
                                            state.cards = cards[key];
                                            return cards[key];
                                        }
                                    }
                                    if (cards.id || cards.cardId) {
                                        state.cards = [cards];
                                        return [cards];
                                    }
                                }
                            }
                        }
                    } catch (_) { /* ignore */ }
                }
                return [];
            }

            // ─── UI Update ─────────────────────────────────────
            function formatBalance(balance) {
                if (balance === null || balance === undefined) return '—';
                let str = balance.toString();
                if (!str.includes('.')) {
                    str = str + '.00';
                } else {
                    const parts = str.split('.');
                    if (parts[1].length === 1) {
                        str = str + '0';
                    }
                }
                return str;
            }

            function updateUI() {
                if (!state.isLoggedIn || !state.token) {
                    loginSection.classList.remove('hidden');
                    userInfoSection.classList.add('hidden');
                    return;
                }

                loginSection.classList.add('hidden');
                userInfoSection.classList.remove('hidden');

                // Phone
                userPhoneDisplay.textContent = '📱 +91 ' + state.phone;

                // Balance
                if (state.balance !== null && state.balance !== undefined) {
                    balanceDisplay.innerHTML = `<span class="balance-currency">₹</span> ${formatBalance(state.balance)}`;
                } else {
                    balanceDisplay.innerHTML = '<span class="loading-spinner"></span> Loading...';
                }

                // Last updated
                if (state.lastUpdate) {
                    lastUpdated.textContent = 'Last updated: ' + state.lastUpdate.toLocaleTimeString();
                } else {
                    lastUpdated.textContent = 'Last updated: —';
                }

                // User ID
                let userId = '—';
                if (state.userData) {
                    if (state.userData.userId) userId = state.userData.userId;
                    else if (state.userData.id) userId = state.userData.id;
                    else if (state.userData.uid) userId = state.userData.uid;
                    else if (state.userData.imUserId) userId = state.userData.imUserId;
                    else if (state.userData.sub) {
                        try {
                            const sub = JSON.parse(state.userData.sub);
                            if (sub.userId) userId = sub.userId;
                            else if (sub.imUserId) userId = sub.imUserId;
                        } catch (e) {}
                    }
                }
                userIdDisplay.textContent = userId;

                // Cards
                if (state.cards && state.cards.length > 0) {
                    let html = '';
                    state.cards.forEach(function(c) {
                        const holder = c.accountName || c.holderName || c.name || 'Unknown';
                        const bank = c.bankName || c.bank || 'Bank';
                        const acc = c.accountNumber || c.cardNumber || c.cardNo || '';
                        const ifsc = c.ifscCode || c.ifsCode || '—';
                        html += `<div class="bank-card">
                            <div class="bank-name">🏦 ${bank}</div>
                            <div class="details">👤 ${holder}</div>
                            <div class="details">💳 ${acc || 'N/A'}</div>
                            <div class="ifsc">🔑 IFSC: ${ifsc}</div>
                        </div>`;
                    });
                    cardsDisplay.innerHTML = html;
                } else {
                    cardsDisplay.innerHTML = '<span style="color:#8895bb;font-size:13px;">No bank cards added</span>';
                }
            }

            async function loadBalance() {
                if (!state.isLoggedIn || !state.token) return null;
                const balance = await apiGetBalance();
                if (balance !== null) {
                    state.balance = balance;
                    state.lastUpdate = new Date();
                }
                updateUI();
                return balance;
            }

            async function loadCards() {
                if (!state.isLoggedIn || !state.token) return [];
                const cards = await apiGetCards();
                if (cards.length > 0) {
                    state.cards = cards;
                }
                updateUI();
                return cards;
            }

            async function loadAllData() {
                if (!state.isLoggedIn || !state.token) return;
                
                showDebug('🔄 Loading all data...', 'info');
                await loadBalance();
                await loadCards();
                showDebug('✅ Data loaded', 'success');
            }

            // ─── Event Handlers ──────────────────────────────
            async function handleLogin() {
                const phone = phoneInput.value.trim().replace(/\D/g, '');
                if (phone.length !== 10) {
                    showToast(loginStatus, '❌ Enter 10-digit phone number', 'error');
                    return;
                }
                loginStatus.classList.add('hidden');
                clearDebug();
                loginBtn.textContent = '⏳ Logging in...';
                loginBtn.disabled = true;

                const result = await apiLogin(phone);

                loginBtn.textContent = '🔑 Login';
                loginBtn.disabled = false;

                if (result.success) {
                    showToast(loginStatus, '✅ Login successful!', 'success');
                    await loadAllData();
                } else {
                    showToast(loginStatus, '❌ ' + (result.msg || 'Login failed'), 'error');
                }
            }

            function handleLogout() {
                state.token = null;
                state.phone = null;
                state.userData = null;
                state.balance = null;
                state.cards = [];
                state.isLoggedIn = false;
                state.lastUpdate = null;
                
                localStorage.removeItem('bhau_token');
                localStorage.removeItem('bhau_phone');
                localStorage.removeItem('bhau_logged_in');
                
                updateUI();
                phoneInput.value = '';
                clearDebug();
            }

            // ─── Auto-restore Session ─────────────────────────
            function restoreSession() {
                const savedToken = localStorage.getItem('bhau_token');
                const savedPhone = localStorage.getItem('bhau_phone');
                const savedLoggedIn = localStorage.getItem('bhau_logged_in');

                if (savedToken && savedPhone && savedLoggedIn === 'true') {
                    state.token = savedToken;
                    state.phone = savedPhone;
                    state.isLoggedIn = true;
                    phoneInput.value = savedPhone;
                    showDebug('🔄 Session restored from localStorage', 'success');
                    loadAllData();
                    return true;
                }
                return false;
            }

            // ─── Init ──────────────────────────────────────────
            function init() {
                loginBtn.addEventListener('click', handleLogin);
                logoutBtn.addEventListener('click', handleLogout);
                refreshBalanceBtn.addEventListener('click', function() {
                    if (state.isLoggedIn && state.token) {
                        showDebug('🔄 Refreshing balance...', 'info');
                        loadBalance().then(balance => {
                            if (balance !== null) {
                                showToast(loginStatus, '✅ Balance updated: ₹' + formatBalance(balance), 'success');
                            }
                        });
                    }
                });
                refreshAllBtn.addEventListener('click', function() {
                    if (state.isLoggedIn && state.token) {
                        loadAllData().then(() => {
                            showToast(loginStatus, '✅ All data refreshed!', 'success');
                        });
                    }
                });

                phoneInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') handleLogin();
                });

                restoreSession();
                updateUI();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
