<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>BHau Lotto - User Info</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #141a2b;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            color: #eef2f9;
            border: 1px solid #2a3450;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #7dffb3, #3d5aa0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            color: #8895bb;
            font-size: 13px;
            margin-top: 4px;
            border-left: 3px solid #3b4b75;
            padding-left: 12px;
            display: inline-block;
        }
        .card {
            background: #10182b;
            border-radius: 24px;
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid #25304a;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a5b3d6;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: #0f1629;
            border: 1px solid #293753;
            border-radius: 40px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #5a76b0;
            box-shadow: 0 0 0 3px #1e2c4a;
        }
        .btn {
            padding: 13px 16px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            background: #3d5aa0;
            color: #fff;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
            text-align: center;
            box-shadow: 0 5px 0 #0f1629;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f1629;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 0 5px 0 #0f1629 !important;
        }
        .btn-logout {
            background: #b13e4b;
            box-shadow: 0 5px 0 #1a0a0a;
            margin-top: 10px;
        }
        .hidden {
            display: none !important;
        }
        .toast {
            background: #1b2542;
            border-radius: 40px;
            padding: 11px 16px;
            margin-top: 10px;
            border-left: 4px solid #5a76b0;
            font-size: 14px;
        }
        .toast.error {
            border-left-color: #c04a5a;
            background: #231b2b;
        }
        .toast.success {
            border-left-color: #3aad6a;
        }
        .info-grid {
            display: grid;
            gap: 10px;
        }
        .info-item {
            background: #0c1427;
            padding: 12px 16px;
            border-radius: 16px;
            border-left: 3px solid #3d5aa0;
        }
        .info-item .label {
            font-size: 11px;
            color: #8895bb;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item .value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            color: #eef2f9;
            word-break: break-all;
        }
        .info-item .value.balance {
            color: #7dffb3;
            font-size: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.online {
            background: #1a3a2a;
            color: #7dffb3;
        }
        .status-badge.offline {
            background: #3a1a1a;
            color: #ff6b6b;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #4a5a7a;
            margin-top: 16px;
        }
        .bank-card {
            background: #0c1427;
            padding: 12px 16px;
            border-radius: 16px;
            border-left: 3px solid #ffd700;
            margin-top: 6px;
        }
        .bank-card .bank-name {
            font-weight: 600;
            color: #ffd700;
        }
        .bank-card .details {
            font-size: 13px;
            color: #8895bb;
            margin-top: 4px;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2a3a5a;
            border-top: 3px solid #7dffb3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .debug-box {
            background: #0a0f1a;
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 10px;
            margin-top: 10px;
            font-size: 11px;
            color: #4a6a8a;
            max-height: 150px;
            overflow: auto;
            font-family: monospace;
        }
        .debug-box .success {
            color: #7dffb3;
        }
        .debug-box .error {
            color: #ff6b6b;
        }
        .debug-box .info {
            color: #5a8aba;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <h1>🎯 BHAU LOTTO</h1>
            <div class="sub">🔑 Default pass: Sanju2005</div>
        </div>

        <!-- Login Section -->
        <div id="loginSection">
            <div class="card">
                <div class="input-group">
                    <label>📱 Phone (10 digits)</label>
                    <input type="tel" id="phoneInput" placeholder="9876543210" maxlength="10" inputmode="numeric" />
                </div>
                <button class="btn" id="loginBtn">🔑 Login</button>
                <div id="loginStatus" class="toast hidden"></div>
                <div id="debugBox" class="debug-box hidden"></div>
            </div>
        </div>

        <!-- User Info Section -->
        <div id="userInfoSection" class="hidden">
            <div class="card" style="border-color: #3aad6a;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <span class="status-badge online">● Online</span>
                    <span style="color:#8895bb;font-size:12px;" id="userPhoneDisplay">📱 +91</span>
                </div>
                
                <div class="info-grid">
                    <div class="info-item">
                        <div class="label">💰 Balance</div>
                        <div class="value balance" id="balanceDisplay">—</div>
                    </div>
                    <div class="info-item">
                        <div class="label">👤 User ID</div>
                        <div class="value" id="userIdDisplay">—</div>
                    </div>
                    <div class="info-item">
                        <div class="label">📧 Email</div>
                        <div class="value" id="emailDisplay">—</div>
                    </div>
                    <div class="info-item">
                        <div class="label">🏦 Bank Cards</div>
                        <div id="cardsDisplay" style="margin-top:6px;">
                            <span style="color:#8895bb;font-size:13px;">No cards added</span>
                        </div>
                    </div>
                </div>

                <button class="btn btn-logout" id="logoutBtn">🚪 Logout</button>
            </div>
        </div>

        <div class="footer">BHau Lotto • User Info Tool</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── State ──────────────────────────────────────────
            const state = {
                token: null,
                phone: null,
                userData: null,
                balance: null,
                cards: [],
                isLoggedIn: false
            };

            // ─── DOM Refs ──────────────────────────────────────
            const $ = id => document.getElementById(id);
            const loginSection = $('loginSection');
            const userInfoSection = $('userInfoSection');
            const phoneInput = $('phoneInput');
            const loginBtn = $('loginBtn');
            const loginStatus = $('loginStatus');
            const logoutBtn = $('logoutBtn');
            const userPhoneDisplay = $('userPhoneDisplay');
            const balanceDisplay = $('balanceDisplay');
            const userIdDisplay = $('userIdDisplay');
            const emailDisplay = $('emailDisplay');
            const cardsDisplay = $('cardsDisplay');
            const debugBox = $('debugBox');

            // ─── Config ─────────────────────────────────────────
            function getConfig() {
                return {
                    base: 'https://api.bh2255.xyz',
                    pay: 'https://api.bh556677ww.com',
                    card: 'https://api.bh2266.xyz',
                    packageId: 2,
                    packageInfo: 'com.resulta.checka',
                    channelId: 'Samsung',
                    origin: 'https://playbhau.com',
                    referer: 'https://playbhau.com/'
                };
            }

            function getDeviceId() {
                let id = localStorage.getItem('bhau_device_id');
                if (!id) {
                    id = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
                    localStorage.setItem('bhau_device_id', id);
                }
                return id;
            }

            function getVisitor() {
                return 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
            }

            function getReqDate() { return Date.now(); }

            // ─── Toast ──────────────────────────────────────────
            function showToast(el, msg, type) {
                el.classList.remove('hidden', 'error', 'success');
                el.textContent = msg;
                if (type) el.classList.add(type);
                clearTimeout(el._toastTimer);
                el._toastTimer = setTimeout(() => el.classList.add('hidden'), 5000);
            }

            // ─── Debug ─────────────────────────────────────────
            function showDebug(msg, type) {
                debugBox.classList.remove('hidden');
                const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
                debugBox.innerHTML += `<div class="${className}">${new Date().toLocaleTimeString()}: ${msg}</div>`;
                debugBox.scrollTop = debugBox.scrollHeight;
            }

            function clearDebug() {
                debugBox.innerHTML = '';
                debugBox.classList.add('hidden');
            }

            // ─── API Calls ─────────────────────────────────────
            async function apiLogin(phone, password) {
                password = password || 'Sanju2005';
                const cfg = getConfig();
                const deviceId = getDeviceId();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    userPhone: phone,
                    password: password,
                    deviceCode: deviceId,
                    distinctId: deviceId,
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    platform: 'h5',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    versionCode: '999',
                    deviceBrand: 'Android',
                    deviceModel: 'Unknown',
                    visitor: visitor,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };
                
                showDebug('📡 Sending login request...', 'info');
                showDebug(`📱 Phone: ${phone}`, 'info');
                
                try {
                    const resp = await fetch(cfg.base + '/app/password/login', {
                        method: 'POST',
                        headers: {
                            'accept': 'application/json, text/plain, */*',
                            'content-type': 'application/json',
                            'origin': cfg.origin,
                            'referer': cfg.referer,
                            'x-device-id': deviceId,
                            'user-agent': 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await resp.json();
                    showDebug(`📊 Status: ${resp.status}`, 'info');
                    
                    console.log('Login Response:', data);
                    
                    // Check if login was successful
                    if (resp.status === 200 && (data.code === 0 || data.success === true)) {
                        
                        // 🔥 CRITICAL FIX: Token is directly in data.data as a string
                        let token = null;
                        
                        // Check if data.data is a string (JWT token)
                        if (typeof data.data === 'string' && data.data.startsWith('eyJ')) {
                            token = data.data;
                            showDebug('✅ Token found in data.data (JWT string)', 'success');
                        } 
                        // Check if data.data is an object with token
                        else if (typeof data.data === 'object' && data.data !== null) {
                            if (data.data.accessToken) token = data.data.accessToken;
                            else if (data.data.token) token = data.data.token;
                            else if (data.data.authToken) token = data.data.authToken;
                        }
                        // Check in main data object
                        else if (data.accessToken) token = data.accessToken;
                        else if (data.token) token = data.token;
                        else if (data.authToken) token = data.authToken;
                        
                        // Also try to parse if data.data is a JSON string
                        if (!token && typeof data.data === 'string') {
                            try {
                                const parsed = JSON.parse(data.data);
                                if (parsed.accessToken) token = parsed.accessToken;
                                else if (parsed.token) token = parsed.token;
                            } catch (e) {
                                // Not JSON, that's fine
                            }
                        }
                        
                        showDebug(`🔑 Token: ${token ? token.substring(0, 30) + '...' : '❌ Not found'}`, token ? 'success' : 'error');
                        
                        if (token) {
                            state.token = token;
                            state.phone = phone;
                            state.isLoggedIn = true;
                            
                            // Store user data if available
                            if (typeof data.data === 'object' && data.data !== null) {
                                state.userData = data.data;
                            } else {
                                state.userData = { phone: phone };
                            }
                            
                            localStorage.setItem('bhau_token', token);
                            localStorage.setItem('bhau_phone', phone);
                            localStorage.setItem('bhau_logged_in', 'true');
                            
                            showDebug('✅ Login successful!', 'success');
                            return { success: true, token: token };
                        } else {
                            showDebug('❌ Token not found in response', 'error');
                            showDebug(`🔍 Full response: ${JSON.stringify(data).substring(0, 500)}`, 'error');
                            return { success: false, msg: 'Token not found in response' };
                        }
                    } else {
                        const errorMsg = data.msg || data.message || 'Login failed';
                        showDebug(`❌ ${errorMsg}`, 'error');
                        return { success: false, msg: errorMsg };
                    }
                } catch (e) {
                    console.error('Login error:', e);
                    showDebug(`❌ Error: ${e.message}`, 'error');
                    return { success: false, msg: e.message || 'Network error' };
                }
            }

            async function apiGetBalance() {
                if (!state.token) return null;
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    versionCode: '999',
                    visitor: visitor,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };
                const endpoints = [
                    cfg.base + '/app/user/getBalanceV2?gameType=POST',
                    cfg.base + '/app/user/info',
                    cfg.base + '/app/user/getBalance'
                ];
                for (const url of endpoints) {
                    try {
                        const resp = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'accept': 'application/json',
                                'content-type': 'application/json',
                                'token': state.token,
                                'origin': cfg.origin,
                                'referer': cfg.referer
                            },
                            body: JSON.stringify(payload)
                        });
                        if (resp.status === 200) {
                            const data = await resp.json();
                            if (data.code === 0) {
                                const ud = data.data || {};
                                const balance = ud.balance ?? ud.coin ?? ud.coins ?? ud.amount ?? ud.credit ?? ud.totalBalance ?? null;
                                if (balance !== null && balance !== undefined) {
                                    state.balance = balance;
                                    return balance;
                                }
                            }
                        }
                    } catch (_) { /* ignore */ }
                }
                return null;
            }

            async function apiGetCards() {
                if (!state.token) return [];
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    versionCode: '999',
                    visitor: visitor
                };
                const endpoints = [
                    'https://api.bh556677wplus.com/app/card/info',
                    cfg.card + '/app/card/list',
                    cfg.pay + '/app/card/info'
                ];
                for (const url of endpoints) {
                    try {
                        const resp = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'accept': 'application/json',
                                'content-type': 'application/json',
                                'token': state.token,
                                'packageid': String(cfg.packageId),
                                'origin': cfg.origin,
                                'referer': cfg.referer
                            },
                            body: JSON.stringify(payload)
                        });
                        if (resp.status === 200) {
                            const data = await resp.json();
                            if (data.code === 0) {
                                let cards = data.data;
                                if (Array.isArray(cards) && cards.length > 0) {
                                    state.cards = cards;
                                    return cards;
                                } else if (typeof cards === 'object' && cards !== null) {
                                    for (const key of ['list', 'cards', 'cardList']) {
                                        if (Array.isArray(cards[key]) && cards[key].length > 0) {
                                            state.cards = cards[key];
                                            return cards[key];
                                        }
                                    }
                                    if (cards.id || cards.cardId) {
                                        state.cards = [cards];
                                        return [cards];
                                    }
                                }
                            }
                        }
                    } catch (_) { /* ignore */ }
                }
                return [];
            }

            // ─── UI Update ─────────────────────────────────────
            function updateUI() {
                if (!state.isLoggedIn || !state.token) {
                    loginSection.classList.remove('hidden');
                    userInfoSection.classList.add('hidden');
                    return;
                }

                loginSection.classList.add('hidden');
                userInfoSection.classList.remove('hidden');

                // Phone
                userPhoneDisplay.textContent = '📱 +91 ' + state.phone;

                // Balance
                if (state.balance !== null) {
                    balanceDisplay.textContent = '₹ ' + state.balance;
                } else {
                    balanceDisplay.innerHTML = '<span class="loading-spinner"></span> Loading...';
                }

                // User ID - try to get from userData
                let userId = '—';
                if (state.userData) {
                    if (state.userData.userId) userId = state.userData.userId;
                    else if (state.userData.id) userId = state.userData.id;
                    else if (state.userData.uid) userId = state.userData.uid;
                    else if (state.userData.imUserId) userId = state.userData.imUserId;
                }
                userIdDisplay.textContent = userId;

                // Email
                let email = '—';
                if (state.userData) {
                    if (state.userData.email) email = state.userData.email;
                    else if (state.userData.userEmail) email = state.userData.userEmail;
                }
                emailDisplay.textContent = email;

                // Cards
                if (state.cards && state.cards.length > 0) {
                    let html = '';
                    state.cards.forEach(function(c) {
                        const holder = c.accountName || c.holderName || c.name || 'Unknown';
                        const bank = c.bankName || c.bank || '';
                        const acc = c.accountNumber || c.cardNumber || c.cardNo || '';
                        const masked = acc && acc.length > 6 ? acc.slice(0, 4) + '****' + acc.slice(-4) : acc;
                        const ifsc = c.ifscCode || c.ifsCode || '—';
                        html += `<div class="bank-card">
                            <div class="bank-name">${bank || 'Bank'}</div>
                            <div class="details">${holder} • ${masked}</div>
                            <div class="details" style="font-size:11px;">IFSC: ${ifsc}</div>
                        </div>`;
                    });
                    cardsDisplay.innerHTML = html;
                } else {
                    cardsDisplay.innerHTML = '<span style="color:#8895bb;font-size:13px;">No bank cards added</span>';
                }
            }

            async function loadUserData() {
                if (!state.isLoggedIn || !state.token) return;

                // Load balance
                const balance = await apiGetBalance();
                if (balance !== null) {
                    state.balance = balance;
                }
                updateUI();

                // Load cards
                const cards = await apiGetCards();
                if (cards.length > 0) {
                    state.cards = cards;
                }
                updateUI();
            }

            // ─── Event Handlers ──────────────────────────────
            async function handleLogin() {
                const phone = phoneInput.value.trim().replace(/\D/g, '');
                if (phone.length !== 10) {
                    showToast(loginStatus, '❌ Enter 10-digit phone number', 'error');
                    return;
                }
                loginStatus.classList.add('hidden');
                clearDebug();
                loginBtn.textContent = '⏳ Logging in...';
                loginBtn.disabled = true;

                const result = await apiLogin(phone);

                loginBtn.textContent = '🔑 Login';
                loginBtn.disabled = false;

                if (result.success) {
                    showToast(loginStatus, '✅ Login successful!', 'success');
                    await loadUserData();
                } else {
                    showToast(loginStatus, '❌ ' + (result.msg || 'Login failed'), 'error');
                }
            }

            function handleLogout() {
                state.token = null;
                state.phone = null;
                state.userData = null;
                state.balance = null;
                state.cards = [];
                state.isLoggedIn = false;
                
                localStorage.removeItem('bhau_token');
                localStorage.removeItem('bhau_phone');
                localStorage.removeItem('bhau_logged_in');
                
                updateUI();
                phoneInput.value = '';
                clearDebug();
            }

            // ─── Auto-restore Session ─────────────────────────
            function restoreSession() {
                const savedToken = localStorage.getItem('bhau_token');
                const savedPhone = localStorage.getItem('bhau_phone');
                const savedLoggedIn = localStorage.getItem('bhau_logged_in');

                if (savedToken && savedPhone && savedLoggedIn === 'true') {
                    state.token = savedToken;
                    state.phone = savedPhone;
                    state.isLoggedIn = true;
                    phoneInput.value = savedPhone;
                    showDebug('🔄 Session restored from localStorage', 'success');
                    loadUserData();
                    return true;
                }
                return false;
            }

            // ─── Init ──────────────────────────────────────────
            function init() {
                loginBtn.addEventListener('click', handleLogin);
                logoutBtn.addEventListener('click', handleLogout);

                phoneInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') handleLogin();
                });

                restoreSession();
                updateUI();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
