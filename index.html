<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>BHau Lotto - User Info</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #141a2b;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            color: #eef2f9;
            border: 1px solid #2a3450;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #7dffb3, #3d5aa0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            color: #8895bb;
            font-size: 13px;
            margin-top: 4px;
            border-left: 3px solid #3b4b75;
            padding-left: 12px;
            display: inline-block;
        }
        .card {
            background: #10182b;
            border-radius: 24px;
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid #25304a;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a5b3d6;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: #0f1629;
            border: 1px solid #293753;
            border-radius: 40px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #5a76b0;
            box-shadow: 0 0 0 3px #1e2c4a;
        }
        .input-group select {
            width: 100%;
            padding: 13px 16px;
            background: #0f1629;
            border: 1px solid #293753;
            border-radius: 40px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            appearance: none;
            cursor: pointer;
        }
        .input-group select:focus {
            border-color: #5a76b0;
            box-shadow: 0 0 0 3px #1e2c4a;
        }
        .input-group select option {
            background: #141a2b;
            color: #eef2f9;
        }
        .btn {
            padding: 13px 16px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            background: #3d5aa0;
            color: #fff;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
            text-align: center;
            box-shadow: 0 5px 0 #0f1629;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f1629;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 0 5px 0 #0f1629 !important;
        }
        .btn-success {
            background: #1f8b4c;
        }
        .btn-danger {
            background: #b13e4b;
        }
        .btn-withdraw {
            background: #d4a020;
            box-shadow: 0 5px 0 #6a4a0a;
        }
        .btn-logout {
            background: #6a3a4a;
            box-shadow: 0 5px 0 #1a0a0a;
            margin-top: 10px;
        }
        .btn-sm {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            box-shadow: 0 3px 0 #0f1629;
        }
        .btn-sm:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f1629;
        }
        .hidden {
            display: none !important;
        }
        .toast {
            background: #1b2542;
            border-radius: 40px;
            padding: 11px 16px;
            margin-top: 10px;
            border-left: 4px solid #5a76b0;
            font-size: 14px;
        }
        .toast.error {
            border-left-color: #c04a5a;
            background: #231b2b;
        }
        .toast.success {
            border-left-color: #3aad6a;
        }
        .info-grid {
            display: grid;
            gap: 10px;
        }
        .info-item {
            background: #0c1427;
            padding: 12px 16px;
            border-radius: 16px;
            border-left: 3px solid #3d5aa0;
        }
        .info-item .label {
            font-size: 11px;
            color: #8895bb;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-item .label .toggle-form-btn {
            background: #2a3a5a;
            border: none;
            color: #a5b3d6;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        }
        .info-item .label .toggle-form-btn:hover {
            background: #3a4a6a;
        }
        .info-item .value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            color: #eef2f9;
            word-break: break-all;
        }
        .info-item .value.balance {
            color: #7dffb3;
            font-size: 28px;
            font-weight: 700;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.online {
            background: #1a3a2a;
            color: #7dffb3;
        }
        .status-badge.offline {
            background: #3a1a1a;
            color: #ff6b6b;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #4a5a7a;
            margin-top: 16px;
        }
        .bank-card {
            background: #0c1427;
            padding: 12px 16px;
            border-radius: 16px;
            border-left: 3px solid #ffd700;
            margin-top: 6px;
            position: relative;
        }
        .bank-card .bank-name {
            font-weight: 600;
            color: #ffd700;
        }
        .bank-card .details {
            font-size: 14px;
            color: #c6d2f0;
            margin-top: 4px;
        }
        .bank-card .ifsc {
            font-size: 12px;
            color: #8895bb;
            margin-top: 2px;
        }
        .bank-card .card-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .bank-card .card-actions .btn-sm {
            padding: 5px 14px;
            font-size: 11px;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2a3a5a;
            border-top: 3px solid #7dffb3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .phone-display {
            font-size: 18px;
            font-weight: 600;
            color: #eef2f9;
        }
        .balance-currency {
            font-size: 16px;
            color: #8895bb;
            margin-right: 2px;
        }
        .debug-box {
            background: #0a0f1a;
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 10px;
            margin-top: 10px;
            font-size: 11px;
            color: #4a6a8a;
            max-height: 120px;
            overflow: auto;
            font-family: monospace;
        }
        .debug-box .success {
            color: #7dffb3;
        }
        .debug-box .error {
            color: #ff6b6b;
        }
        .debug-box .info {
            color: #5a8aba;
        }
        .last-updated {
            font-size: 10px;
            color: #4a5a7a;
            margin-top: 2px;
        }
        .form-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .form-row .btn {
            flex: 1;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .card-header .card-id {
            font-size: 11px;
            color: #4a5a7a;
        }
        .withdraw-section {
            background: #0f1a2a;
            border-radius: 16px;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #2a3a4a;
        }
        .withdraw-section .quick-amounts {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .withdraw-section .quick-amounts .btn-sm {
            flex: 1;
            min-width: 50px;
            background: #1a2a3a;
            border: 1px solid #2a4a5a;
            color: #a5b3d6;
            box-shadow: none;
            padding: 6px 10px;
        }
        .withdraw-section .quick-amounts .btn-sm:hover {
            background: #2a4a5a;
        }
        .withdraw-section .quick-amounts .btn-sm:active {
            transform: translateY(1px);
        }
        .selected-card {
            background: #1a2a3a;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            color: #a5b3d6;
            margin-bottom: 8px;
        }
        .selected-card strong {
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <h1>🎯 BHAU LOTTO</h1>
            <div class="sub">🔑 Default pass: Sanju2005</div>
        </div>

        <!-- Login Section -->
        <div id="loginSection">
            <div class="card">
                <div class="input-group">
                    <label>📱 Phone (10 digits)</label>
                    <input type="tel" id="phoneInput" placeholder="9876543210" maxlength="10" inputmode="numeric" />
                </div>
                <button class="btn" id="loginBtn">🔑 Login</button>
                <div id="loginStatus" class="toast hidden"></div>
                <div id="debugBox" class="debug-box hidden"></div>
            </div>
        </div>

        <!-- User Info Section -->
        <div id="userInfoSection" class="hidden">
            <div class="card" style="border-color: #3aad6a;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <span class="status-badge online">● Online</span>
                    <span class="phone-display" id="userPhoneDisplay">📱 +91</span>
                </div>
                
                <div class="info-grid">
                    <div class="info-item" style="border-left-color: #7dffb3;">
                        <div class="label">
                            <span>💰 Balance</span>
                            <button class="toggle-form-btn" id="refreshBalanceBtn">⟳ Refresh</button>
                        </div>
                        <div class="value balance" id="balanceDisplay">—</div>
                        <div class="last-updated" id="lastUpdated">Last updated: —</div>
                    </div>
                    <div class="info-item">
                        <div class="label">🆔 User ID</div>
                        <div class="value" id="userIdDisplay">—</div>
                    </div>
                    <div class="info-item">
                        <div class="label">📊 Total Withdraw</div>
                        <div class="value" id="withdrawDisplay">—</div>
                    </div>
                    <div class="info-item">
                        <div class="label">💰 Total Recharge</div>
                        <div class="value" id="rechargeDisplay">—</div>
                    </div>
                    <div class="info-item">
                        <div class="label">
                            <span>🏦 Bank Cards</span>
                            <button class="toggle-form-btn" id="toggleAddCardBtn">➕ Add Card</button>
                        </div>
                        <div id="cardsDisplay" style="margin-top:6px;">
                            <span style="color:#8895bb;font-size:13px;">No cards added</span>
                        </div>
                    </div>
                </div>

                <!-- Add Card Form -->
                <div id="addCardForm" class="hidden" style="margin-top:12px;padding-top:12px;border-top:1px solid #1a2a3a;">
                    <div class="input-group"><label>👤 Account Holder Name</label><input id="cardName" placeholder="Full Name" /></div>
                    <div class="input-group"><label>💳 Account Number</label><input id="cardNumber" placeholder="1234567890" /></div>
                    <div class="input-group"><label>🏛️ IFSC Code</label><input id="ifscCode" placeholder="MAHB0002009" value="MAHB0002009" /></div>
                    <div class="input-group"><label>📧 Email (optional)</label><input id="cardEmail" placeholder="email@gmail.com" /></div>
                    <div class="form-row">
                        <button class="btn btn-success" id="submitCardBtn">✅ Add Card</button>
                        <button class="btn" id="cancelAddCard" style="background:transparent;border:1px solid #3c4e78;color:#c6d2f0;box-shadow:none;">Cancel</button>
                    </div>
                    <div id="addCardStatus" class="toast hidden mt-2"></div>
                </div>

                <!-- Withdraw Section -->
                <div id="withdrawSection" style="margin-top:12px;padding-top:12px;border-top:1px solid #1a2a3a;">
                    <div class="withdraw-section">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                            <span style="font-weight:600;color:#d4a020;">💸 Withdraw</span>
                            <button class="toggle-form-btn" id="toggleWithdrawBtn">Open</button>
                        </div>
                        
                        <div id="withdrawForm" class="hidden">
                            <div class="selected-card" id="selectedCardDisplay">
                                <span style="color:#8895bb;">No card selected</span>
                            </div>
                            
                            <div class="input-group">
                                <label>💳 Select Card</label>
                                <select id="cardSelect">
                                    <option value="">— Select a card —</option>
                                </select>
                            </div>
                            
                            <div class="input-group">
                                <label>💰 Amount</label>
                                <input type="number" id="withdrawAmount" placeholder="Enter amount" min="1" />
                            </div>
                            
                            <div class="quick-amounts">
                                <button class="btn-sm quick-amount" data-amount="100">₹100</button>
                                <button class="btn-sm quick-amount" data-amount="200">₹200</button>
                                <button class="btn-sm quick-amount" data-amount="500">₹500</button>
                                <button class="btn-sm quick-amount" data-amount="1000">₹1000</button>
                                <button class="btn-sm quick-amount" data-amount="2000">₹2000</button>
                                <button class="btn-sm quick-amount" data-amount="5000">₹5000</button>
                            </div>
                            
                            <button class="btn btn-withdraw" id="submitWithdrawBtn">💸 Withdraw</button>
                            <div id="withdrawStatus" class="toast hidden mt-2"></div>
                        </div>
                    </div>
                </div>

                <button class="btn btn-logout" id="logoutBtn">🚪 Logout</button>
            </div>
        </div>

        <div class="footer">BHau Lotto • User Info Tool</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── State ──────────────────────────────────────────
            const state = {
                token: null,
                phone: null,
                userData: null,
                balance: null,
                cards: [],
                isLoggedIn: false,
                lastUpdate: null,
                withdraw: null,
                recharge: null
            };

            // ─── DOM Refs ──────────────────────────────────────
            const $ = id => document.getElementById(id);
            const loginSection = $('loginSection');
            const userInfoSection = $('userInfoSection');
            const phoneInput = $('phoneInput');
            const loginBtn = $('loginBtn');
            const loginStatus = $('loginStatus');
            const logoutBtn = $('logoutBtn');
            const userPhoneDisplay = $('userPhoneDisplay');
            const balanceDisplay = $('balanceDisplay');
            const userIdDisplay = $('userIdDisplay');
            const withdrawDisplay = $('withdrawDisplay');
            const rechargeDisplay = $('rechargeDisplay');
            const cardsDisplay = $('cardsDisplay');
            const debugBox = $('debugBox');
            const lastUpdated = $('lastUpdated');
            const refreshBalanceBtn = $('refreshBalanceBtn');
            
            // Add Card Form
            const addCardForm = $('addCardForm');
            const toggleAddCardBtn = $('toggleAddCardBtn');
            const cardName = $('cardName');
            const cardNumber = $('cardNumber');
            const ifscCode = $('ifscCode');
            const cardEmail = $('cardEmail');
            const submitCardBtn = $('submitCardBtn');
            const cancelAddCard = $('cancelAddCard');
            const addCardStatus = $('addCardStatus');

            // Withdraw
            const toggleWithdrawBtn = $('toggleWithdrawBtn');
            const withdrawForm = $('withdrawForm');
            const cardSelect = $('cardSelect');
            const withdrawAmount = $('withdrawAmount');
            const submitWithdrawBtn = $('submitWithdrawBtn');
            const withdrawStatus = $('withdrawStatus');
            const selectedCardDisplay = $('selectedCardDisplay');

            // ─── Config ─────────────────────────────────────────
            function getConfig() {
                return {
                    base: 'https://api.bh2255.xyz',
                    pay: 'https://api.bh556677ww.com',
                    card: 'https://api.bh2266.xyz',
                    packageId: 2,
                    packageInfo: 'com.resulta.checka',
                    channelId: 'Samsung',
                    origin: 'https://playbhau.com',
                    referer: 'https://playbhau.com/'
                };
            }

            function getDeviceId() {
                let id = localStorage.getItem('bhau_device_id');
                if (!id) {
                    id = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
                    localStorage.setItem('bhau_device_id', id);
                }
                return id;
            }

            function getVisitor() {
                return 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
            }

            function getReqDate() { return Date.now(); }

            // ─── Toast ──────────────────────────────────────────
            function showToast(el, msg, type) {
                el.classList.remove('hidden', 'error', 'success');
                el.textContent = msg;
                if (type) el.classList.add(type);
                clearTimeout(el._toastTimer);
                el._toastTimer = setTimeout(() => el.classList.add('hidden'), 5000);
            }

            // ─── Debug ─────────────────────────────────────────
            function showDebug(msg, type) {
                debugBox.classList.remove('hidden');
                const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
                debugBox.innerHTML += `<div class="${className}">${new Date().toLocaleTimeString()}: ${msg}</div>`;
                debugBox.scrollTop = debugBox.scrollHeight;
            }

            function clearDebug() {
                debugBox.innerHTML = '';
                debugBox.classList.add('hidden');
            }

            // ─── API Calls ─────────────────────────────────────
            async function apiLogin(phone, password) {
                password = password || 'Sanju2005';
                const cfg = getConfig();
                const deviceId = getDeviceId();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    userPhone: phone,
                    password: password,
                    deviceCode: deviceId,
                    distinctId: deviceId,
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    platform: 'h5',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    versionCode: '999',
                    deviceBrand: 'Android',
                    deviceModel: 'Unknown',
                    visitor: visitor,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };
                
                showDebug('📡 Sending login request...', 'info');
                showDebug(`📱 Phone: ${phone}`, 'info');
                
                try {
                    const resp = await fetch(cfg.base + '/app/password/login', {
                        method: 'POST',
                        headers: {
                            'accept': 'application/json, text/plain, */*',
                            'content-type': 'application/json',
                            'origin': cfg.origin,
                            'referer': cfg.referer,
                            'x-device-id': deviceId,
                            'user-agent': 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await resp.json();
                    showDebug(`📊 Status: ${resp.status}`, 'info');
                    
                    console.log('Login Response:', data);
                    
                    if (resp.status === 200 && (data.code === 0 || data.success === true)) {
                        
                        let token = null;
                        let userData = null;
                        
                        if (typeof data.data === 'string' && data.data.startsWith('eyJ')) {
                            token = data.data;
                            showDebug('✅ Token found', 'success');
                        } 
                        else if (typeof data.data === 'object' && data.data !== null) {
                            userData = data.data;
                            if (data.data.accessToken) token = data.data.accessToken;
                            else if (data.data.token) token = data.data.token;
                        }
                        else if (data.accessToken) token = data.accessToken;
                        else if (data.token) token = data.token;
                        
                        if (token) {
                            state.token = token;
                            state.phone = phone;
                            state.isLoggedIn = true;
                            
                            if (userData) {
                                state.userData = userData;
                            } else if (typeof data.data === 'string') {
                                try {
                                    const parts = token.split('.');
                                    if (parts.length === 3) {
                                        const payload = JSON.parse(atob(parts[1]));
                                        console.log('JWT Payload:', payload);
                                        state.userData = payload;
                                    }
                                } catch (e) {
                                    console.log('Could not parse JWT');
                                }
                            }
                            
                            localStorage.setItem('bhau_token', token);
                            localStorage.setItem('bhau_phone', phone);
                            localStorage.setItem('bhau_logged_in', 'true');
                            
                            showDebug('✅ Login successful!', 'success');
                            return { success: true, token: token };
                        } else {
                            showDebug('❌ Token not found', 'error');
                            return { success: false, msg: 'Token not found' };
                        }
                    } else {
                        const errorMsg = data.msg || data.message || 'Login failed';
                        showDebug(`❌ ${errorMsg}`, 'error');
                        return { success: false, msg: errorMsg };
                    }
                } catch (e) {
                    console.error('Login error:', e);
                    showDebug(`❌ Error: ${e.message}`, 'error');
                    return { success: false, msg: e.message || 'Network error' };
                }
            }

            async function apiGetUserInfo() {
                if (!state.token) return null;
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    visitor: visitor,
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36',
                    versionCode: '999'
                };
                
                try {
                    const resp = await fetch(cfg.base + '/app/user/info', {
                        method: 'POST',
                        headers: {
                            'accept': 'application/json',
                            'content-type': 'application/json',
                            'token': state.token,
                            'origin': cfg.origin,
                            'referer': cfg.referer
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    if (resp.status === 200) {
                        const data = await resp.json();
                        console.log('User Info Response:', data);
                        
                        if (data.code === 0 && data.data) {
                            const ud = data.data;
                            state.userData = ud;
                            
                            if (ud.userBalance !== undefined && ud.userBalance !== null) {
                                state.balance = parseFloat(ud.userBalance);
                            } else if (ud.totalBalance !== undefined && ud.totalBalance !== null) {
                                state.balance = parseFloat(ud.totalBalance);
                            } else if (ud.balance !== undefined && ud.balance !== null) {
                                state.balance = parseFloat(ud.balance);
                            }
                            
                            if (ud.withdraw !== undefined && ud.withdraw !== null) {
                                state.withdraw = parseFloat(ud.withdraw);
                            }
                            
                            if (ud.recharge !== undefined && ud.recharge !== null) {
                                state.recharge = parseFloat(ud.recharge);
                            }
                            
                            state.lastUpdate = new Date();
                            return data.data;
                        }
                    }
                } catch (e) {
                    console.error('Error fetching user info:', e);
                }
                return null;
            }

            async function apiGetCards() {
                if (!state.token) return [];
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    versionCode: '999',
                    visitor: visitor
                };
                const endpoints = [
                    'https://api.bh556677wplus.com/app/card/info',
                    cfg.card + '/app/card/list',
                    cfg.pay + '/app/card/info'
                ];
                for (const url of endpoints) {
                    try {
                        const resp = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'accept': 'application/json',
                                'content-type': 'application/json',
                                'token': state.token,
                                'packageid': String(cfg.packageId),
                                'origin': cfg.origin,
                                'referer': cfg.referer
                            },
                            body: JSON.stringify(payload)
                        });
                        if (resp.status === 200) {
                            const data = await resp.json();
                            console.log('Cards Response:', data);
                            if (data.code === 0) {
                                let cards = data.data;
                                if (Array.isArray(cards) && cards.length > 0) {
                                    state.cards = cards;
                                    return cards;
                                } else if (typeof cards === 'object' && cards !== null) {
                                    for (const key of ['list', 'cards', 'cardList']) {
                                        if (Array.isArray(cards[key]) && cards[key].length > 0) {
                                            state.cards = cards[key];
                                            return cards[key];
                                        }
                                    }
                                    if (cards.id || cards.cardId) {
                                        state.cards = [cards];
                                        return [cards];
                                    }
                                }
                            }
                        }
                    } catch (_) { /* ignore */ }
                }
                return [];
            }

            async function apiAddCard(name, number, ifsc, email, smsCode) {
                if (!state.token) return { success: false, msg: 'Not logged in' };
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const url = cfg.base + '/app/card/add';
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    visitor: visitor,
                    cardName: name,
                    cardNumber: number,
                    email: email || '',
                    ifsCode: ifsc,
                    smsCode: smsCode || '',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36',
                    versionCode: '999'
                };
                const headers = {
                    'accept': 'application/json',
                    'content-type': 'application/json',
                    'token': state.token,
                    'packageid': String(cfg.packageId),
                    'origin': cfg.origin,
                    'referer': cfg.referer
                };
                try {
                    const resp = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
                    const data = await resp.json();
                    console.log('Add Card Response:', data);
                    if (resp.status === 200 && (data.code === 0 || data.success === true)) {
                        return { success: true, data: data };
                    } else {
                        return { success: false, msg: data.msg || 'Add card failed' };
                    }
                } catch (e) {
                    return { success: false, msg: e.message };
                }
            }

            async function apiDeleteCard(cardId) {
                if (!state.token) return { success: false, msg: 'Not logged in' };
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const url = cfg.base + '/app/card/del';
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    visitor: visitor,
                    id: parseInt(cardId),
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36',
                    versionCode: '999'
                };
                const headers = {
                    'accept': 'application/json',
                    'content-type': 'application/json',
                    'token': state.token,
                    'packageid': String(cfg.packageId),
                    'origin': cfg.origin,
                    'referer': cfg.referer
                };
                try {
                    const resp = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
                    const data = await resp.json();
                    console.log('Delete Card Response:', data);
                    if (resp.status === 200 && (data.code === 0 || data.success === true)) {
                        return { success: true, data: data };
                    } else {
                        return { success: false, msg: data.msg || 'Delete card failed' };
                    }
                } catch (e) {
                    return { success: false, msg: e.message };
                }
            }

            async function apiWithdraw(amount) {
                if (!state.token) return { success: false, msg: 'Not logged in' };
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const url = cfg.base + '/app/pay/paid';
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    visitor: visitor,
                    price: parseFloat(amount),
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36',
                    versionCode: '999'
                };
                const headers = {
                    'accept': 'application/json',
                    'content-type': 'application/json',
                    'token': state.token,
                    'packageid': String(cfg.packageId),
                    'origin': cfg.origin,
                    'referer': cfg.referer
                };
                try {
                    const resp = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
                    const data = await resp.json();
                    console.log('Withdraw Response:', data);
                    if (resp.status === 200 && (data.code === 0 || data.success === true)) {
                        return { success: true, data: data };
                    } else {
                        return { success: false, msg: data.msg || 'Withdraw failed' };
                    }
                } catch (e) {
                    return { success: false, msg: e.message };
                }
            }

            // ─── UI Update ─────────────────────────────────────
            function formatNumber(num) {
                if (num === null || num === undefined) return '—';
                return parseFloat(num).toFixed(2);
            }

            function updateCardSelect() {
                const select = cardSelect;
                const currentVal = select.value;
                select.innerHTML = '<option value="">— Select a card —</option>';
                
                if (state.cards && state.cards.length > 0) {
                    state.cards.forEach(function(c) {
                        const id = c.id || c.cardId || c.card_id || '?';
                        const holder = c.accountName || c.holderName || c.name || 'Unknown';
                        const bank = c.bankName || c.bank || 'Bank';
                        const acc = c.accountNumber || c.cardNumber || c.cardNo || '';
                        const masked = acc && acc.length > 6 ? acc.slice(0, 4) + '****' + acc.slice(-4) : acc;
                        const option = document.createElement('option');
                        option.value = id;
                        option.textContent = `${bank} - ${holder} (${masked})`;
                        select.appendChild(option);
                    });
                }
                
                if (currentVal) {
                    select.value = currentVal;
                }
                updateSelectedCardDisplay();
            }

            function updateSelectedCardDisplay() {
                const cardId = cardSelect.value;
                if (!cardId) {
                    selectedCardDisplay.innerHTML = '<span style="color:#8895bb;">No card selected</span>';
                    return;
                }
                
                const card = state.cards.find(c => {
                    const id = c.id || c.cardId || c.card_id || '?';
                    return String(id) === String(cardId);
                });
                
                if (card) {
                    const holder = card.accountName || card.holderName || card.name || 'Unknown';
                    const bank = card.bankName || card.bank || 'Bank';
                    const acc = card.accountNumber || card.cardNumber || card.cardNo || '';
                    selectedCardDisplay.innerHTML = `<strong>${bank}</strong> - ${holder} (${acc})`;
                } else {
                    selectedCardDisplay.innerHTML = '<span style="color:#8895bb;">Card not found</span>';
                }
            }

            function updateUI() {
                if (!state.isLoggedIn || !state.token) {
                    loginSection.classList.remove('hidden');
                    userInfoSection.classList.add('hidden');
                    return;
                }

                loginSection.classList.add('hidden');
                userInfoSection.classList.remove('hidden');

                userPhoneDisplay.textContent = '📱 +91 ' + state.phone;

                if (state.balance !== null && state.balance !== undefined) {
                    balanceDisplay.innerHTML = `<span class="balance-currency">₹</span> ${formatNumber(state.balance)}`;
                } else {
                    balanceDisplay.innerHTML = '<span class="loading-spinner"></span> Loading...';
                }

                if (state.lastUpdate) {
                    lastUpdated.textContent = 'Last updated: ' + state.lastUpdate.toLocaleTimeString();
                } else {
                    lastUpdated.textContent = 'Last updated: —';
                }

                let userId = '—';
                if (state.userData) {
                    if (state.userData.userId) userId = state.userData.userId;
                    else if (state.userData.id) userId = state.userData.id;
                    else if (state.userData.uid) userId = state.userData.uid;
                    else if (state.userData.imUserId) userId = state.userData.imUserId;
                }
                userIdDisplay.textContent = userId;

                if (state.withdraw !== null && state.withdraw !== undefined) {
                    withdrawDisplay.textContent = '₹ ' + formatNumber(state.withdraw);
                } else {
                    withdrawDisplay.textContent = '—';
                }

                if (state.recharge !== null && state.recharge !== undefined) {
                    rechargeDisplay.textContent = '₹ ' + formatNumber(state.recharge);
                } else {
                    rechargeDisplay.textContent = '—';
                }

                // Cards with delete button
                if (state.cards && state.cards.length > 0) {
                    let html = '';
                    state.cards.forEach(function(c) {
                        const id = c.id || c.cardId || c.card_id || '?';
                        const holder = c.accountName || c.holderName || c.name || 'Unknown';
                        const bank = c.bankName || c.bank || 'Bank';
                        const acc = c.accountNumber || c.cardNumber || c.cardNo || '';
                        const ifsc = c.ifscCode || c.ifsCode || '—';
                        html += `<div class="bank-card">
                            <div class="card-header">
                                <div class="bank-name">🏦 ${bank}</div>
                                <div class="card-id">ID: ${id}</div>
                            </div>
                            <div class="details">👤 ${holder}</div>
                            <div class="details">💳 ${acc || 'N/A'}</div>
                            <div class="ifsc">🔑 IFSC: ${ifsc}</div>
                            <div class="card-actions">
                                <button class="btn btn-danger btn-sm delete-card-btn" data-card-id="${id}">🗑️ Delete</button>
                            </div>
                        </div>`;
                    });
                    cardsDisplay.innerHTML = html;
                    
                    document.querySelectorAll('.delete-card-btn').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            const cardId = this.getAttribute('data-card-id');
                            handleDeleteCard(cardId);
                        });
                    });
                } else {
                    cardsDisplay.innerHTML = '<span style="color:#8895bb;font-size:13px;">No bank cards added</span>';
                }

                // Update card select for withdraw
                updateCardSelect();
            }

            async function loadAllData() {
                if (!state.isLoggedIn || !state.token) return;
                
                showDebug('🔄 Loading user data...', 'info');
                await apiGetUserInfo();
                await apiGetCards();
                updateUI();
                showDebug('✅ Data loaded successfully!', 'success');
            }

            async function refreshBalance() {
                if (!state.isLoggedIn || !state.token) return;
                showDebug('🔄 Refreshing balance...', 'info');
                await apiGetUserInfo();
                updateUI();
                showToast(loginStatus, '✅ Balance updated!', 'success');
            }

            // ─── Card Handlers ─────────────────────────────────
            async function handleAddCard() {
                const name = cardName.value.trim();
                const number = cardNumber.value.trim().replace(/\s/g, '');
                const ifsc = ifscCode.value.trim().toUpperCase();
                const email = cardEmail.value.trim();
                
                if (!name || !number || !ifsc) {
                    showToast(addCardStatus, '❌ Name, Account, IFSC required', 'error');
                    return;
                }
                
                submitCardBtn.textContent = '⏳ Adding...';
                submitCardBtn.disabled = true;
                
                const result = await apiAddCard(name, number, ifsc, email, '');
                
                submitCardBtn.textContent = '✅ Add Card';
                submitCardBtn.disabled = false;
                
                if (result.success) {
                    showToast(addCardStatus, '✅ Card added successfully!', 'success');
                    addCardForm.classList.add('hidden');
                    toggleAddCardBtn.textContent = '➕ Add Card';
                    await loadAllData();
                } else {
                    showToast(addCardStatus, '❌ ' + (result.msg || 'Failed to add card'), 'error');
                }
            }

            async function handleDeleteCard(cardId) {
                if (!confirm(`Are you sure you want to delete card ID: ${cardId}?`)) return;
                
                showDebug(`🗑️ Deleting card ${cardId}...`, 'info');
                const result = await apiDeleteCard(cardId);
                
                if (result.success) {
                    showToast(loginStatus, '✅ Card deleted successfully!', 'success');
                    await loadAllData();
                } else {
                    showToast(loginStatus, '❌ ' + (result.msg || 'Failed to delete card'), 'error');
                }
            }

            // ─── Withdraw Handlers ─────────────────────────────
            async function handleWithdraw() {
                const cardId = cardSelect.value;
                const amount = parseFloat(withdrawAmount.value.trim());
                
                if (!cardId) {
                    showToast(withdrawStatus, '❌ Please select a card', 'error');
                    return;
                }
                
                if (!amount || amount <= 0) {
                    showToast(withdrawStatus, '❌ Please enter a valid amount', 'error');
                    return;
                }
                
                if (state.balance !== null && amount > state.balance) {
                    showToast(withdrawStatus, `❌ Insufficient balance. Available: ₹${formatNumber(state.balance)}`, 'error');
                    return;
                }
                
                submitWithdrawBtn.textContent = '⏳ Processing...';
                submitWithdrawBtn.disabled = true;
                
                const result = await apiWithdraw(amount);
                
                submitWithdrawBtn.textContent = '💸 Withdraw';
                submitWithdrawBtn.disabled = false;
                
                if (result.success) {
                    showToast(withdrawStatus, `✅ Withdrawal of ₹${amount} successful!`, 'success');
                    await loadAllData();
                    withdrawAmount.value = '';
                } else {
                    showToast(withdrawStatus, '❌ ' + (result.msg || 'Withdrawal failed'), 'error');
                }
            }

            // ─── Event Handlers ──────────────────────────────
            async function handleLogin() {
                const phone = phoneInput.value.trim().replace(/\D/g, '');
                if (phone.length !== 10) {
                    showToast(loginStatus, '❌ Enter 10-digit phone number', 'error');
                    return;
                }
                loginStatus.classList.add('hidden');
                clearDebug();
                loginBtn.textContent = '⏳ Logging in...';
                loginBtn.disabled = true;

                const result = await apiLogin(phone);

                loginBtn.textContent = '🔑 Login';
                loginBtn.disabled = false;

                if (result.success) {
                    showToast(loginStatus, '✅ Login successful!', 'success');
                    await loadAllData();
                } else {
                    showToast(loginStatus, '❌ ' + (result.msg || 'Login failed'), 'error');
                }
            }

            function handleLogout() {
                state.token = null;
                state.phone = null;
                state.userData = null;
                state.balance = null;
                state.cards = [];
                state.isLoggedIn = false;
                state.lastUpdate = null;
                state.withdraw = null;
                state.recharge = null;
                
                localStorage.removeItem('bhau_token');
                localStorage.removeItem('bhau_phone');
                localStorage.removeItem('bhau_logged_in');
                
                updateUI();
                phoneInput.value = '';
                clearDebug();
                addCardForm.classList.add('hidden');
                toggleAddCardBtn.textContent = '➕ Add Card';
                withdrawForm.classList.add('hidden');
                toggleWithdrawBtn.textContent = 'Open';
            }

            function toggleAddCardForm() {
                if (addCardForm.classList.contains('hidden')) {
                    addCardForm.classList.remove('hidden');
                    toggleAddCardBtn.textContent = '✖️ Close';
                    const names = ['Ananya', 'Aadhya', 'Ishita', 'Aanya', 'Advika', 'Charvi', 'Diya', 'Anvi', 'Aarohi', 'Sara',
                        'Riya', 'Naira', 'Pari', 'Tara', 'Ira', 'Vanya', 'Myra', 'Kavya', 'Priya', 'Neha'];
                    const last = ['Sharma', 'Verma', 'Patel', 'Kumar', 'Singh', 'Gupta', 'Yadav', 'Joshi', 'Malhotra', 'Mehta'];
                    const f = names[Math.floor(Math.random() * names.length)];
                    const l = last[Math.floor(Math.random() * last.length)];
                    cardName.value = f + ' ' + l;
                    cardEmail.value = f.toLowerCase() + l.toLowerCase() + '@gmail.com';
                    cardNumber.value = '';
                    ifscCode.value = 'MAHB0002009';
                    addCardStatus.classList.add('hidden');
                } else {
                    addCardForm.classList.add('hidden');
                    toggleAddCardBtn.textContent = '➕ Add Card';
                }
            }

            function toggleWithdrawForm() {
                if (withdrawForm.classList.contains('hidden')) {
                    withdrawForm.classList.remove('hidden');
                    toggleWithdrawBtn.textContent = '✖️ Close';
                    updateCardSelect();
                } else {
                    withdrawForm.classList.add('hidden');
                    toggleWithdrawBtn.textContent = 'Open';
                }
            }

            // ─── Auto-restore Session ─────────────────────────
            function restoreSession() {
                const savedToken = localStorage.getItem('bhau_token');
                const savedPhone = localStorage.getItem('bhau_phone');
                const savedLoggedIn = localStorage.getItem('bhau_logged_in');

                if (savedToken && savedPhone && savedLoggedIn === 'true') {
                    state.token = savedToken;
                    state.phone = savedPhone;
                    state.isLoggedIn = true;
                    phoneInput.value = savedPhone;
                    showDebug('🔄 Session restored', 'success');
                    loadAllData();
                    return true;
                }
                return false;
            }

            // ─── Init ──────────────────────────────────────────
            function init() {
                loginBtn.addEventListener('click', handleLogin);
                logoutBtn.addEventListener('click', handleLogout);
                refreshBalanceBtn.addEventListener('click', refreshBalance);
                
                toggleAddCardBtn.addEventListener('click', toggleAddCardForm);
                cancelAddCard.addEventListener('click', function() {
                    addCardForm.classList.add('hidden');
                    toggleAddCardBtn.textContent = '➕ Add Card';
                });
                submitCardBtn.addEventListener('click', handleAddCard);

                toggleWithdrawBtn.addEventListener('click', toggleWithdrawForm);
                submitWithdrawBtn.addEventListener('click', handleWithdraw);
                cardSelect.addEventListener('change', updateSelectedCardDisplay);

                // Quick amount buttons
                document.querySelectorAll('.quick-amount').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        withdrawAmount.value = this.getAttribute('data-amount');
                    });
                });

                phoneInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') handleLogin();
                });

                restoreSession();
                updateUI();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
