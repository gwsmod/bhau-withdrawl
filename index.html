<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Tracker</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:#080b12;
  color:#fff;
  padding:25px;
}

.container{
  max-width:900px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.title{
  font-size:26px;
  font-weight:800;
}

.status{
  font-size:12px;
  color:#34d399;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.card{
  background:#111722;
  border:1px solid #202938;
  border-radius:18px;
  padding:22px;
  min-height:140px;
}

.icon{
  font-size:28px;
  margin-bottom:15px;
}

.label{
  color:#8993a4;
  font-size:13px;
  margin-bottom:8px;
}

.value{
  font-size:30px;
  font-weight:800;
}

.profit{
  grid-column:1/-1;
}

.footer{
  margin-top:20px;
  color:#667085;
  font-size:11px;
  text-align:center;
}

@media(max-width:600px){
  body{
    padding:15px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .profit{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <div class="title">📊 Profit Tracker</div>
      <div class="status" id="status">● Connecting...</div>
    </div>
  </div>

  <div class="grid">

    <div class="card">
      <div class="icon">👥</div>
      <div class="label">Today Users</div>
      <div class="value" id="users">0</div>
    </div>

    <div class="card">
      <div class="icon">💰</div>
      <div class="label">Today Deposit</div>
      <div class="value" id="deposit">₹0.00</div>
    </div>

    <div class="card">
      <div class="icon">💸</div>
      <div class="label">Today Withdrawal</div>
      <div class="value" id="withdrawal">₹0.00</div>
    </div>

    <div class="card profit">
      <div class="icon">📈</div>
      <div class="label">Today Profit</div>
      <div class="value" id="profit">₹0.00</div>
    </div>

  </div>

  <div class="footer">
    Last update: <span id="updated">Never</span>
  </div>

</div>

<script>

const WORKER_URL =
  "https://delicate-block-ad76profit-tracker.sanjubot100.workers.dev";

const TRACKER_KEY =
  "YOUR_TRACKER_KEY";


async function loadStats(){

  try{

    const response = await fetch(
      WORKER_URL + "/stats",
      {
        method:"GET",
        headers:{
          "X-Tracker-Key":TRACKER_KEY
        }
      }
    );

    const data = await response.json();

    if(!response.ok || !data.ok){
      throw new Error(data.error || "Failed");
    }

    document.getElementById("users").textContent =
      data.today_users || 0;

    document.getElementById("deposit").textContent =
      "₹" + Number(data.today_deposit || 0).toFixed(2);

    document.getElementById("withdrawal").textContent =
      "₹" + Number(data.today_withdrawal || 0).toFixed(2);

    document.getElementById("profit").textContent =
      "₹" + Number(data.today_profit || 0).toFixed(2);

    document.getElementById("status").textContent =
      "● Live";

    document.getElementById("updated").textContent =
      new Date().toLocaleTimeString("en-IN");

  }catch(error){

    console.error(error);

    document.getElementById("status").textContent =
      "● Connection error";
  }
}


// First load
loadStats();

// Update every 10 seconds
setInterval(loadStats,10000);

</script>

</body>
</html>
