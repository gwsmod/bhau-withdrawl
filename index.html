<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Tracker</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:#080b12;
  color:#fff;
  padding:25px;
}

.container{
  max-width:900px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.title{
  font-size:26px;
  font-weight:800;
}

.status{
  font-size:12px;
  color:#34d399;
  margin-top:5px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.card{
  background:#111722;
  border:1px solid #202938;
  border-radius:18px;
  padding:22px;
  min-height:140px;
  transition:.25s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}

.icon{
  font-size:28px;
  margin-bottom:15px;
}

.label{
  color:#8993a4;
  font-size:13px;
  margin-bottom:8px;
}

.value{
  font-size:30px;
  font-weight:800;
}

.profit{
  grid-column:1/-1;
}

.invest{
  border-color:#1683ff55;
}

.invest .value{
  color:#38bdf8;
  text-shadow:0 0 15px #38bdf844;
}

.dev-footer{
  width:max-content;
  max-width:100%;
  margin:22px auto 0;
  padding:13px 28px;
  border-radius:16px;

  font-size:15px;
  font-weight:1000;
  letter-spacing:2px;
  color:#fff;

  background:
    linear-gradient(
      135deg,
      #210b3b,
      #071b3d,
      #3b0b30,
      #071f3a
    );

  border:1px solid #a855f7;

  box-shadow:
    0 0 8px #a855f7,
    0 0 22px #a855f766,
    0 0 45px #22d3ee33,
    inset 0 2px 0 rgba(255,255,255,.35),
    inset 0 -7px 15px rgba(0,0,0,.7);

  text-shadow:
    0 0 5px #fff,
    0 0 12px #c084fc,
    2px 3px 0 #111827;

  transform:perspective(500px) rotateX(3deg);

  animation:devGlow 1.8s ease-in-out infinite alternate;

@keyframes devGlow{

  0%{

    box-shadow:

      0 0 20px #a855f755,

</head>

<body>

<div class="container">

  <div class="header">
    <div>

      <div class="title">
        📊 Profit Tracker
      </div>

      <div class="status" id="status">
        ● Connecting...
      </div>

    </div>
  </div>


  <div class="grid">

    <!-- USERS -->
    <div class="card">

      <div class="icon">👥</div>

      <div class="label">
        Today Users
      </div>

      <div class="value" id="users">
        0
      </div>

    </div>


    <!-- DEPOSIT -->
    <div class="card">

      <div class="icon">💰</div>

      <div class="label">
        Today Deposit
      </div>

      <div class="value" id="deposit">
        ₹0.00
      </div>

    </div>


    <!-- WITHDRAWAL -->
    <div class="card">

      <div class="icon">💸</div>

      <div class="label">
        Today Withdrawal
      </div>

      <div class="value" id="withdrawal">
        ₹0.00
      </div>

    </div>


    <!-- USER INVEST -->
    <div class="card invest">

      <div class="icon">💎</div>

      <div class="label">
        User Invest
      </div>

      <div class="value" id="invest">
        ₹0.00
      </div>

    </div>


    <!-- PROFIT -->
    <div class="card profit">

      <div class="icon">📈</div>

      <div class="label">
        Today Profit
      </div>

      <div class="value" id="profit">
        ₹0.00
      </div>

    </div>

  </div>


  <div class="footer">
    Last update:
    <span id="updated">Never</span>
  </div>


  <div class="dev-footer">
    ⚡ DEV BY SANJU ⚡
  </div>

</div>


<script>

const WORKER_URL =
  "https://delicate-block-ad76profit-tracker.sanjubot100.workers.dev";

const TRACKER_KEY =
  "PT-2026-X9K7-AB42";


async function loadStats(){

  try{

    const response = await fetch(
      WORKER_URL + "/stats",
      {
        method:"GET",

        headers:{
          "X-Tracker-Key":TRACKER_KEY
        },

        cache:"no-store"
      }
    );


    const data =
      await response.json();


    if(!response.ok || !data.ok){

      throw new Error(
        data.error || "Failed"
      );

    }


    /* ==========================
       TODAY USERS
    ========================== */

    const totalUsers =
      Number(data.today_users || 0);


    document.getElementById("users").textContent =
      totalUsers;


    /* ==========================
       DEPOSIT

       API amount includes bonus.

       225 -> 200
       335 -> 300

       Other amounts stay unchanged.
    ========================== */

    const creditedDeposit =
      Number(data.today_deposit || 0);


    let mainDeposit =
      creditedDeposit;


    if(creditedDeposit === 225){

      mainDeposit = 200;

    }
    else if(creditedDeposit === 335){

      mainDeposit = 300;

    }


    document.getElementById("deposit").textContent =
      "₹" + mainDeposit.toFixed(2);


    /* ==========================
       WITHDRAWAL
    ========================== */

    const withdrawalAmount =
      Number(data.today_withdrawal || 0);


    document.getElementById("withdrawal").textContent =
      "₹" + withdrawalAmount.toFixed(2);


    /* ==========================
       USER INVEST
    ========================== */

    const userInvest =
      totalUsers * 7.2;


    document.getElementById("invest").textContent =
      "₹" + userInvest.toFixed(2);


    /* ==========================
       PROFIT

       Withdrawal - Main Deposit

       Negative = ₹0.00
    ========================== */

    const profit =
      Math.max(
        0,
        withdrawalAmount - mainDeposit
      );


    document.getElementById("profit").textContent =
      "₹" + profit.toFixed(2);


    /* ==========================
       STATUS
    ========================== */

    const status =
      document.getElementById("status");


    status.textContent =
      "● Live";

    status.style.color =
      "#34d399";


    /* ==========================
       LAST UPDATE
    ========================== */

    document.getElementById("updated").textContent =
      new Date().toLocaleTimeString(
        "en-IN",
        {
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      );


  }catch(error){

    console.error(error);


    const status =
      document.getElementById("status");


    status.textContent =
      "● Connection error";

    status.style.color =
      "#ef4444";

  }

}


/* FIRST LOAD */
loadStats();


/* AUTO UPDATE EVERY 10 SECONDS */
setInterval(
  loadStats,
  10000
);

</script>

</body>
</html>
